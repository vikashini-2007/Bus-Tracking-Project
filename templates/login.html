<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Bus Tracking System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(rgba(10, 20, 40, 0.65),
                rgba(10, 20, 40, 0.65)),
                url("https://images.unsplash.com/photo-1519003722824-194d4455a60c?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(12px);

            border-radius: 20px;

            border: 1px solid rgba(255, 255, 255, 0.3);

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);

            color: white;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            margin-bottom: 30px;
            opacity: 0.85;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            margin-bottom: 20px;

            border: none;
            border-radius: 8px;

            outline: none;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: white;
            color: #222;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            background: #eeeeee;
        }

        .back {
            display: inline-block;
            margin-top: 25px;

            color: white;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🔐 Login</h1>

        <p class="subtitle">
            Welcome back to Bus Tracking System
        </p>

        <form method="POST">

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <button type="submit">
                Login
            </button>

        </form>

        <a class="back" href="/">
            ← Back to Home
        </a>

    </div>

</body>

</html>
