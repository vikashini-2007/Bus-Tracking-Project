<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bus Tracking System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(rgba(0, 0, 0, 0.55),
                rgba(0, 0, 0, 0.55)),
                url("https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }

        .container {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 30px;
        }

        .card {
            max-width: 900px;
            width: 90%;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);

            padding: 45px;
            border-radius: 20px;

            border: 1px solid rgba(255, 255, 255, 0.25);

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .buttons a {
            text-decoration: none;
            color: white;

            background: rgba(255, 255, 255, 0.18);

            padding: 13px 22px;
            border-radius: 10px;

            border: 1px solid rgba(255, 255, 255, 0.3);

            transition: 0.3s;
        }

        .buttons a:hover {
            background: white;
            color: black;
            transform: translateY(-3px);
        }

        .tag {
            margin-top: 25px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🚌 Bus Tracking System</h1>

            <p class="subtitle">
                Real-Time Public Transport Tracking for Small Cities
            </p>

            <div class="buttons">

                <a href="/register">📝 Register</a>

                <a href="/login">🔐 Login</a>

                <a href="/add_route">🛣️ Add Route</a>

                <a href="/add_bus">🚌 Add Bus</a>

                <a href="/buses">📋 View Buses</a>

                <a href="/map">🗺️ Live Map</a>

                <a href="/update_location">📍 Update Location</a>

                <a href="/search_bus">🔎 Search Bus</a>

                <a href="/bus_details">📄 Bus Details</a>

            </div>

            <p class="tag">
                SIH 2025 Project | Smart & Real-Time Transportation
            </p>

        </div>

    </div>

</body>

</html>
